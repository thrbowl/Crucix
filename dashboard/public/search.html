<!DOCTYPE html>

<html class="dark" lang="zh"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="/libs/tailwind.js"></script>
<link href="/libs/fonts/space-grotesk-inter.css" rel="stylesheet"/>
<link href="/libs/fonts/material-symbols.css" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
            vertical-align: middle;
        }
        .glass-panel {
            background: rgba(20, 25, 35, 0.6);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .tactical-corner {
            position: relative;
        }
        .tactical-corner::before {
            content: '';
            position: absolute;
            top: -1px;
            left: -1px;
            width: 8px;
            height: 8px;
            border-top: 2px solid #00e5ff;
            border-left: 2px solid #00e5ff;
        }
        .mode-tab.active { color: #00e5ff; border-bottom: 2px solid #00e5ff; }
        .mode-tab { color: #64748b; }
        .mode-tab:hover { color: #94a3b8; }
        .source-badge {
            font-size: 10px;
            padding: 2px 8px;
            border-radius: 4px;
            font-weight: 600;
            letter-spacing: 0.05em;
            text-transform: uppercase;
        }
        .highlight { background: rgba(0,229,255,0.15); color: #00e5ff; border-radius: 2px; padding: 0 2px; }
        input[type="date"]::-webkit-calendar-picker-indicator {
            filter: invert(1) brightness(1.8) sepia(1) saturate(3) hue-rotate(155deg);
            cursor: pointer;
            opacity: 0.85;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#40000d",
                        "on-secondary-container": "#ffc2c4",
                        "surface-tint": "#00daf3",
                        "neon-glow": "rgba(0, 229, 255, 0.3)",
                        "on-surface": "#dce4e5",
                        "on-secondary": "#67001b",
                        "tertiary-fixed-dim": "#f3bf26",
                        "tertiary": "#ffeac0",
                        "secondary": "#ffb2b7",
                        "on-surface-variant": "#bac9cc",
                        "secondary-fixed-dim": "#ffb2b7",
                        "primary-container": "#00e5ff",
                        "outline": "#849396",
                        "on-tertiary-fixed": "#251a00",
                        "on-tertiary": "#3e2e00",
                        "primary": "#c3f5ff",
                        "surface-container-highest": "#2e3638",
                        "surface-container": "#192122",
                        "text-secondary": "#94A3B8",
                        "tertiary-fixed": "#ffdf96",
                        "surface-variant": "#2e3638",
                        "inverse-on-surface": "#2a3233",
                        "background": "#0B0E14",
                        "surface-container-lowest": "#080f11",
                        "surface-bright": "#333a3c",
                        "on-primary": "#00363d",
                        "on-background": "#dce4e5",
                        "primary-fixed-dim": "#00daf3",
                        "on-primary-container": "#00626e",
                        "tertiary-container": "#fec931",
                        "border-subtle": "rgba(255, 255, 255, 0.08)",
                        "on-primary-fixed-variant": "#004f58",
                        "on-secondary-fixed-variant": "#92002a",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#9cf0ff",
                        "surface-container-low": "#151d1e",
                        "text-primary": "#E2E8F0",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#b50036",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-fixed": "#ffdadb",
                        "on-primary-fixed": "#001f24",
                        "surface": "rgba(20, 25, 35, 0.6)",
                        "on-tertiary-container": "#6f5500",
                        "surface-container-high": "#242b2d",
                        "outline-variant": "#3b494c",
                        "inverse-surface": "#dce4e5",
                        "surface-dim": "#0d1516",
                        "on-error": "#690005",
                        "inverse-primary": "#006875"
                    },
                    "fontFamily": {
                        "mono-data": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"],
                        "h1": ["Space Grotesk"],
                        "h2": ["Space Grotesk"],
                        "h3": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md selection:bg-primary-container selection:text-on-primary-container">
<div id="page-content" style="visibility:hidden" class="flex pt-16 min-h-screen">
<main class="flex-1 ml-64 p-8">
<div class="max-w-6xl mx-auto space-y-6">

<!-- Page Header -->
<div>
<h1 class="font-h1 text-h1 text-on-surface mb-1 tracking-tight">情报检索</h1>
<p class="text-text-secondary font-body-md text-sm">搜索全球威胁情报数据库 — CVE、IOC、威胁组织、攻击事件。</p>
</div>

<!-- Mode Tabs -->
<div class="flex space-x-1 border-b border-white/5">
<button data-mode="intel" class="mode-tab active px-6 py-3 font-label-caps text-sm flex items-center space-x-2 border-b-2 border-cyan-400 text-cyan-400 transition-colors">
<span class="material-symbols-outlined text-sm">article</span>
<span>原始情报</span>
</button>
<button data-mode="entity" class="mode-tab px-6 py-3 font-label-caps text-sm flex items-center space-x-2 transition-colors">
<span class="material-symbols-outlined text-sm">hub</span>
<span>STIX实体</span>
</button>
</div>

<!-- Search Bar -->
<div class="relative group">
<div class="absolute -inset-0.5 bg-gradient-to-r from-cyan-500/20 to-blue-500/20 rounded-xl blur opacity-30 group-hover:opacity-100 transition duration-1000"></div>
<div class="relative flex items-center glass-panel rounded-xl overflow-hidden tactical-corner">
<div class="pl-6 text-slate-500">
<span class="material-symbols-outlined text-3xl">manage_search</span>
</div>
<input id="search-input" class="w-full bg-transparent border-none focus:ring-0 text-xl py-5 px-4 font-body-lg text-on-surface placeholder:text-slate-600" placeholder="输入关键词，CVE-ID，域名，IP，或威胁组织名称..." type="text"/>
<div class="pr-4 flex items-center space-x-3">
<span class="h-8 w-px bg-white/10"></span>
<input id="date-from" type="date" class="bg-transparent text-slate-200 border-none focus:ring-0 text-sm font-label-caps w-[132px]"/>
<span class="text-sm text-slate-500">—</span>
<input id="date-to" type="date" class="bg-transparent text-slate-200 border-none focus:ring-0 text-sm font-label-caps w-[132px]"/>
<span class="h-8 w-px bg-white/10"></span>
<button id="search-btn" class="bg-cyan-500 text-slate-950 px-8 py-3 rounded font-bold font-['Space_Grotesk'] hover:bg-cyan-400 transition-all shadow-[0_0_15px_rgba(0,229,255,0.4)] whitespace-nowrap">查询</button>
</div>
</div>
</div>

<!-- ===== Intel Mode Panel ===== -->
<div id="panel-intel" class="space-y-4">
<!-- Intel Filters -->
<div id="intel-filter-bar" class="flex items-center space-x-3 flex-wrap gap-y-2">
<span class="text-xs text-slate-500 font-label-caps">筛选类型:</span>
<button data-intel-type="" class="intel-filter px-3 py-1.5 text-xs rounded-full bg-cyan-500/15 text-cyan-400 border border-cyan-500/30 font-label-caps">全部</button>
</div>
<!-- Intel Results (Feed) -->
<div id="intel-results" class="space-y-3">
<div class="text-sm text-slate-500 py-12 text-center">加载中...</div>
</div>
<!-- Intel Pagination -->
<div id="intel-pagination" class="flex justify-center space-x-2 pt-4 hidden"></div>
</div>

<!-- ===== Entity Mode Panel ===== -->
<div id="panel-entity" class="hidden space-y-4">
<!-- Entity Type Tabs (dynamic) -->
<div id="entity-tabs" class="flex items-center space-x-3 flex-wrap gap-y-2"></div>
<!-- Entity Results Grid -->
<div id="entity-results" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
<div class="text-sm text-slate-500 py-12 text-center col-span-3">加载中...</div>
</div>
<!-- Entity Pagination -->
<div id="entity-pagination" class="flex justify-center space-x-2 pt-4 hidden"></div>
</div>
</div>

</div>
</main>
</div>

<script type="module">
  import { initShell } from './shell.js';
  import { apiFetch } from './auth.js';
  await initShell('search');

  // === State ===
  let currentMode = 'intel';   // 'intel' | 'entity'
  let intelFilterType = '';     // source_type filter for intel mode
  let entityTypeFilter = '';    // STIX type filter for entity mode

  // === Default date range: last 30 days ===
  const toDate = new Date();
  const fromDate = new Date();
  fromDate.setDate(fromDate.getDate() - 30);
  const fmt = d => d.toISOString().slice(0, 10);
  document.getElementById('date-from').value = fmt(fromDate);
  document.getElementById('date-to').value = fmt(toDate);

  // === Mode Tab Switching ===
  const panelIntel = document.getElementById('panel-intel');
  const panelEntity = document.getElementById('panel-entity');

  document.querySelectorAll('[data-mode]').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-mode]').forEach(b => {
        b.classList.remove('active', 'text-cyan-400', 'border-b-2', 'border-cyan-400');
        b.classList.add('text-slate-500');
      });
      btn.classList.remove('text-slate-500');
      btn.classList.add('active', 'text-cyan-400', 'border-b-2', 'border-cyan-400');
      currentMode = btn.dataset.mode;

      panelIntel.classList.toggle('hidden', currentMode !== 'intel');
      panelEntity.classList.toggle('hidden', currentMode !== 'entity');
    });
  });

  // === Intel Filters (dynamic) ===
  const INTEL_TYPE_LABEL = {
    vulnerability: '漏洞', ioc: 'IOC', threat_intel: '威胁情报',
    event: '事件', news: '新闻', exposure: '暴露面',
  };

  function bindIntelFilterBtn(btn) {
    btn.addEventListener('click', () => {
      document.querySelectorAll('[data-intel-type]').forEach(b => { b.className = 'intel-filter ' + CLS_FILTER_INACTIVE; });
      btn.className = 'intel-filter ' + CLS_FILTER_ACTIVE;
      intelFilterType = btn.dataset.intelType;
      const q = searchInput?.value?.trim();
      if (currentMode === 'intel') { if (q) doIntelSearch(q, 1); else loadIntel(1); }
    });
  }

  // Bind the static "全部" button
  document.querySelectorAll('[data-intel-type]').forEach(bindIntelFilterBtn);

  async function loadIntelSummary(q = '') {
    const dateFrom = document.getElementById('date-from')?.value || '';
    const dateTo   = document.getElementById('date-to')?.value   || '';
    const body = {};
    if (q)        body.q         = q;
    if (dateFrom) body.date_from = dateFrom + 'T00:00:00Z';
    if (dateTo)   body.date_to   = dateTo   + 'T23:59:59Z';

    try {
      const res = await apiFetch('/api/v1/intel/summary', {
        method: 'POST',
        body: JSON.stringify(body),
      });
      if (!res?.ok) return;
      const json = await res.json();

      // 清除上次动态生成的类型按钮，保留"全部"和标签
      const bar = document.getElementById('intel-filter-bar');
      bar.querySelectorAll('[data-intel-type]:not([data-intel-type=""])').forEach(b => b.remove());

      for (const { type, count } of json.data?.types ?? []) {
        const label = INTEL_TYPE_LABEL[type];
        if (!label) continue;
        const btn = document.createElement('button');
        btn.dataset.intelType = type;
        btn.className = 'intel-filter ' + CLS_FILTER_INACTIVE;
        btn.innerHTML = `${label}<span class="ml-1.5 opacity-50 font-normal">${count}</span>`;
        bindIntelFilterBtn(btn);
        bar.appendChild(btn);
      }
    } catch (err) {
      console.error('[intel summary] error:', err);
    }
  }

  // 日期变化时同步刷新条数和结果
  ['date-from', 'date-to'].forEach(id => {
    document.getElementById(id)?.addEventListener('change', () => {
      const q = searchInput?.value?.trim();
      if (currentMode === 'intel') {
        loadIntelSummary(q);
        if (q) doIntelSearch(q, 1); else loadIntel(1);
      } else {
        loadEntitySummary();
        if (q) doEntitySearch(q, 1); else loadEntities(1);
      }
    });
  });

  // === Entity Type Tabs (dynamic) ===
  const TYPE_META = {
    vulnerability:    { icon: 'bug_report',   label: '安全漏洞' },
    indicator:        { icon: 'radar',        label: 'IOC 标识' },
    'threat-actor':   { icon: 'group',        label: '威胁行为者' },
    malware:          { icon: 'skull',         label: '恶意软件' },
    campaign:         { icon: 'campaign',      label: '攻击活动' },
    report:           { icon: 'description',   label: '情报报告' },
    'attack-pattern': { icon: 'target',        label: '攻击手法' },
    'intrusion-set':  { icon: 'shield',        label: '入侵集合' },
    infrastructure:   { icon: 'dns',           label: '基础设施' },
    'course-of-action': { icon: 'build',       label: '应对措施' },
    identity:         { icon: 'badge',         label: '身份标识' },
  };

  const entityTabs = document.getElementById('entity-tabs');
  let entityTypes = [];

  const CLS_FILTER_ACTIVE   = 'px-3 py-1.5 text-xs rounded-full bg-cyan-500/15 text-cyan-400 border border-cyan-500/30 font-label-caps';
  const CLS_FILTER_INACTIVE = 'px-3 py-1.5 text-xs rounded-full bg-white/5 text-slate-400 border border-white/10 hover:border-cyan-500/30 hover:text-cyan-400 transition-colors font-label-caps';

  function renderEntityTabs(types) {
    entityTypes = types;
    entityTabs.innerHTML = '<span class="text-xs text-slate-500 font-label-caps">筛选类型:</span>';

    const allBtn = document.createElement('button');
    allBtn.dataset.typeTab = '_all';
    allBtn.className = CLS_FILTER_ACTIVE;
    allBtn.textContent = '全部';
    allBtn.addEventListener('click', () => switchEntityTab(allBtn, '_all'));
    entityTabs.appendChild(allBtn);

    for (const t of types) {
      const meta = TYPE_META[t.type] || { label: t.type };
      const btn = document.createElement('button');
      btn.dataset.typeTab = t.type;
      btn.className = CLS_FILTER_INACTIVE;
      btn.innerHTML = `${meta.label}<span class="ml-1.5 opacity-50 font-normal">${t.count}</span>`;
      btn.addEventListener('click', () => switchEntityTab(btn, t.type));
      entityTabs.appendChild(btn);
    }
  }

  function switchEntityTab(btn, type) {
    entityTabs.querySelectorAll('button').forEach(b => { b.className = CLS_FILTER_INACTIVE; });
    btn.className = CLS_FILTER_ACTIVE;
    entityTypeFilter = type;
    loadEntities(1);
  }

  async function loadEntitySummary(q = '') {
    const dateFrom = document.getElementById('date-from')?.value || '';
    const dateTo   = document.getElementById('date-to')?.value   || '';
    const body = {};
    if (q)        body.q         = q;
    if (dateFrom) body.date_from = dateFrom + 'T00:00:00Z';
    if (dateTo)   body.date_to   = dateTo   + 'T23:59:59Z';
    try {
      const res = await apiFetch('/api/v1/entities/summary', {
        method: 'POST',
        body: JSON.stringify(body),
      });
      if (!res?.ok) return;
      const { data } = await res.json();
      renderEntityTabs(data.types ?? []);
    } catch { /* ignore */ }
  }

  async function loadEntities(page = 1) {
    const container = document.getElementById('entity-results');
    const pagination = document.getElementById('entity-pagination');
    const type = entityTypeFilter || '_all';
    container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center col-span-3">加载中...</div>';
    pagination.classList.add('hidden');

    const dateFrom = document.getElementById('date-from')?.value || '';
    const dateTo   = document.getElementById('date-to')?.value   || '';
    const dateParams = (dateFrom ? `&date_from=${encodeURIComponent(dateFrom + 'T00:00:00Z')}` : '')
                     + (dateTo   ? `&date_to=${encodeURIComponent(dateTo   + 'T23:59:59Z')}` : '');

    try {
      const res = await apiFetch(`/api/v1/entities/${type}?page=${page}&limit=20${dateParams}`);
      if (!res?.ok) {
        container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center col-span-3">加载失败</div>';
        return;
      }
      const { data } = await res.json();
      renderEntityResults(data.items ?? []);
      renderEntityPagination(data.page, data.limit, data.items?.length ?? 0);
    } catch {
      container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center col-span-3">网络错误</div>';
    }
  }

  // Initial load
  loadIntelSummary();
  loadIntel(1);
  loadEntitySummary();
  loadEntities(1);

  // === Search ===
  const searchInput = document.getElementById('search-input');
  const searchBtn = document.getElementById('search-btn');

  async function doSearch(page = 1) {
    const q = searchInput?.value?.trim();

    if (currentMode === 'intel') {
      loadIntelSummary(q);
      if (q) await doIntelSearch(q, page); else loadIntel(page);
    } else {
      loadEntitySummary();
      if (q) await doEntitySearch(q, page); else loadEntities(page);
    }
  }

  // --- Intel Browse (no keyword) ---
  async function loadIntel(page = 1) {
    const container = document.getElementById('intel-results');
    const pagination = document.getElementById('intel-pagination');
    container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center">加载中...</div>';
    pagination.classList.add('hidden');

    const body = { page };
    if (intelFilterType) body.source_types = [intelFilterType];
    const dateFrom = document.getElementById('date-from')?.value || '';
    const dateTo = document.getElementById('date-to')?.value || '';
    if (dateFrom) body.date_from = dateFrom + 'T00:00:00Z';
    if (dateTo) body.date_to = dateTo + 'T23:59:59Z';

    try {
      const res = await apiFetch('/api/v1/intel/search?page=' + page, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      if (!res?.ok) {
        container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center">加载失败</div>';
        return;
      }
      const { data } = await res.json();
      renderIntelResults(data.items ?? [], '');
      renderIntelPagination(data.page, data.limit, data.total);
    } catch {
      container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center">网络错误</div>';
    }
  }

  // --- Intel Search ---
  async function doIntelSearch(q, page = 1) {
    const container = document.getElementById('intel-results');
    const pagination = document.getElementById('intel-pagination');
    container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center">搜索中...</div>';
    pagination.classList.add('hidden');

    const dateFrom = document.getElementById('date-from')?.value || '';
    const dateTo = document.getElementById('date-to')?.value || '';
    const body = { q, page };
    if (intelFilterType) body.source_types = [intelFilterType];
    if (dateFrom) body.date_from = dateFrom + 'T00:00:00Z';
    if (dateTo) body.date_to = dateTo + 'T23:59:59Z';

    try {
      const res = await apiFetch('/api/v1/intel/search?page=' + page, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      if (!res?.ok) {
        container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center">搜索失败，请重试</div>';
        return;
      }
      const { data } = await res.json();
      renderIntelResults(data.items ?? [], q);
      renderIntelPagination(data.page, data.limit, data.total);
    } catch {
      container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center">网络错误</div>';
    }
  }

  const SOURCE_TYPE_STYLE = {
    vulnerability: { bg: 'bg-red-500/10', text: 'text-red-400', border: 'border-red-500/20', label: '漏洞' },
    ioc:           { bg: 'bg-orange-500/10', text: 'text-orange-400', border: 'border-orange-500/20', label: 'IOC' },
    threat_intel:  { bg: 'bg-purple-500/10', text: 'text-purple-400', border: 'border-purple-500/20', label: '威胁情报' },
    event:         { bg: 'bg-amber-500/10', text: 'text-amber-400', border: 'border-amber-500/20', label: '事件' },
    news:          { bg: 'bg-blue-500/10', text: 'text-blue-400', border: 'border-blue-500/20', label: '新闻' },
    exposure:      { bg: 'bg-yellow-500/10', text: 'text-yellow-400', border: 'border-yellow-500/20', label: '暴露面' },
  };

  const SEVERITY_STYLE = {
    CRITICAL: 'bg-red-500/15 text-red-400 border-red-500/30',
    HIGH:     'bg-orange-500/15 text-orange-400 border-orange-500/30',
    MEDIUM:   'bg-yellow-500/15 text-yellow-400 border-yellow-500/30',
    LOW:      'bg-slate-500/15 text-slate-400 border-slate-500/30',
  };

  function renderIntelResults(items, query) {
    const container = document.getElementById('intel-results');
    if (!items.length) {
      container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center">未找到相关情报</div>';
      return;
    }
    container.innerHTML = '';

    for (const item of items) {
      const d = item.display ?? {};
      const style = SOURCE_TYPE_STYLE[item.source_type] || { bg: 'bg-slate-500/10', text: 'text-slate-400', border: 'border-slate-500/20', label: item.source_type };
      const time = item.first_seen_at ? timeAgo(item.first_seen_at) : '';

      // Tags row: severity + content tags
      const tagsHtml = [];
      if (d.severity && SEVERITY_STYLE[d.severity]) {
        tagsHtml.push(`<span class="source-badge ${SEVERITY_STYLE[d.severity]} border font-bold">${d.severity}</span>`);
      }
      for (const tag of (d.tags ?? []).slice(0, 3)) {
        if (tag !== d.severity) {
          tagsHtml.push(`<span class="source-badge ${style.bg} ${style.text} border ${style.border}">${esc(tag)}</span>`);
        }
      }

      // Meta row (key-value pairs)
      const metaHtml = (d.meta ?? []).slice(0, 3).map(m =>
        `<span class="text-[10px] text-slate-500">${esc(m.label)}: <span class="text-slate-300">${esc(m.value)}</span></span>`
      ).join('<span class="text-slate-700 mx-1">·</span>');

      const row = document.createElement('div');
      row.className = 'glass-panel p-4 rounded-lg hover:bg-white/5 transition-all cursor-pointer group';
      row.innerHTML = `
        <div class="flex items-start justify-between gap-4">
          <div class="flex-1 min-w-0 space-y-2">
            <div class="flex items-center space-x-2 flex-wrap gap-y-1">
              <span class="source-badge ${style.bg} ${style.text} border ${style.border}">${style.label}</span>
              <span class="text-[10px] text-slate-500 font-label-caps">${esc(item.source_name)}</span>
              ${time ? `<span class="text-[10px] text-slate-600">${time}</span>` : ''}
            </div>
            <div class="text-sm font-medium text-on-surface truncate">${esc(d.headline ?? item.title ?? '—')}</div>
            ${d.description ? `<div class="text-xs text-slate-500 line-clamp-2">${esc(d.description)}</div>` : ''}
            ${tagsHtml.length ? `<div class="flex flex-wrap gap-1">${tagsHtml.join('')}</div>` : ''}
            ${metaHtml ? `<div class="flex flex-wrap items-center gap-x-1">${metaHtml}</div>` : ''}
          </div>
          <span class="material-symbols-outlined text-slate-600 group-hover:text-cyan-400 transition-colors text-sm mt-1 shrink-0">chevron_right</span>
        </div>`;
      container.appendChild(row);
    }
  }

  function renderIntelPagination(currentPage, limit, total) {
    const el = document.getElementById('intel-pagination');
    const totalPages = Math.ceil(total / limit);
    if (totalPages <= 1) { el.classList.add('hidden'); return; }

    el.classList.remove('hidden');
    el.innerHTML = '';

    for (let p = 1; p <= Math.min(totalPages, 7); p++) {
      const btn = document.createElement('button');
      btn.textContent = p;
      btn.className = p === currentPage
        ? 'px-3 py-1 text-xs rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-label-caps'
        : 'px-3 py-1 text-xs rounded bg-white/5 text-slate-400 border border-white/10 hover:text-cyan-400 transition-colors font-label-caps';
      btn.addEventListener('click', () => doSearch(p));
      el.appendChild(btn);
    }
  }

  // --- Entity Search (keyword) ---
  async function doEntitySearch(q, page = 1) {
    const container = document.getElementById('entity-results');
    const pagination = document.getElementById('entity-pagination');
    container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center col-span-3">搜索中...</div>';
    pagination.classList.add('hidden');

    try {
      const body = { query: q };
      if (entityTypeFilter && entityTypeFilter !== '_all') body.types = [entityTypeFilter];
      const res = await apiFetch('/api/v1/search?page=' + page, {
        method: 'POST',
        body: JSON.stringify(body),
      });
      if (!res?.ok) {
        container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center col-span-3">搜索失败，请重试</div>';
        return;
      }
      const { data } = await res.json();
      renderEntityResults(data.items ?? data ?? []);
    } catch {
      container.innerHTML = '<div class="text-sm text-red-400 py-12 text-center col-span-3">网络错误</div>';
    }
  }

  function renderEntityPagination(currentPage, limit, total) {
    const el = document.getElementById('entity-pagination');
    const totalPages = Math.ceil(total / limit);
    if (totalPages <= 1) { el.classList.add('hidden'); return; }

    el.classList.remove('hidden');
    el.innerHTML = '';

    for (let p = 1; p <= Math.min(totalPages, 7); p++) {
      const btn = document.createElement('button');
      btn.textContent = p;
      btn.className = p === currentPage
        ? 'px-3 py-1 text-xs rounded bg-cyan-500/20 text-cyan-400 border border-cyan-500/30 font-label-caps'
        : 'px-3 py-1 text-xs rounded bg-white/5 text-slate-400 border border-white/10 hover:text-cyan-400 transition-colors font-label-caps';
      btn.addEventListener('click', () => {
        const q = searchInput?.value?.trim();
        if (q) doEntitySearch(q, p); else loadEntities(p);
      });
      el.appendChild(btn);
    }
  }

  function normalizeEntity(item) {
    const n = {
      headline:    item.name ?? item.value ?? item.id ?? '未知',
      subtitle:    null,
      description: item.description ?? item.summary ?? null,
      tags:        Array.isArray(item.labels) ? [...item.labels] : [],
      meta:        [],
    };
    const date = s => s ? s.slice(0, 10) : null;
    const aliases = arr => arr?.length ? arr.slice(0, 3).join(', ') : null;

    switch (item.type) {
      case 'vulnerability': {
        const cve = item.external_references?.find(r => r.source_name === 'cve');
        if (cve?.external_id) n.subtitle = cve.external_id;
        const cvss = item.x_cvss_v3_base_score ?? item.x_cvss_score ?? null;
        const sev  = item.x_crucix_severity ?? item.x_severity ?? null;
        if (sev)  n.tags.unshift(sev);
        if (cvss != null) n.meta.push({ label: 'CVSS', value: String(cvss) });
        const epss = item.x_epss_score ?? null;
        if (epss != null) n.meta.push({ label: 'EPSS', value: (epss * 100).toFixed(1) + '%' });
        break;
      }
      case 'indicator': {
        if (item.pattern) n.subtitle = item.pattern.length > 72 ? item.pattern.slice(0, 72) + '…' : item.pattern;
        if (item.indicator_types?.length) n.tags.unshift(...item.indicator_types);
        if (date(item.valid_from))  n.meta.push({ label: '有效期', value: date(item.valid_from) });
        if (date(item.valid_until)) n.meta.push({ label: '到期',   value: date(item.valid_until) });
        break;
      }
      case 'malware': {
        if (item.malware_types?.length) n.tags.unshift(...item.malware_types);
        if (item.is_family) n.meta.push({ label: '类型', value: '恶意软件家族' });
        const caps = item.capabilities?.slice(0, 3).join(', ');
        if (caps) n.meta.push({ label: '能力', value: caps });
        const a = aliases(item.aliases);
        if (a) n.meta.push({ label: '别名', value: a });
        break;
      }
      case 'threat-actor': {
        if (item.threat_actor_types?.length) n.tags.unshift(...item.threat_actor_types);
        const a = aliases(item.aliases);
        if (a)                    n.meta.push({ label: '别名',   value: a });
        if (item.sophistication)  n.meta.push({ label: '复杂度', value: item.sophistication });
        if (item.resource_level)  n.meta.push({ label: '资源',   value: item.resource_level });
        const goals = item.goals?.slice(0, 2).join(', ');
        if (goals) n.meta.push({ label: '目标', value: goals });
        break;
      }
      case 'campaign': {
        const a = aliases(item.aliases);
        if (a) n.meta.push({ label: '别名', value: a });
        if (date(item.first_seen)) n.meta.push({ label: '首次', value: date(item.first_seen) });
        if (date(item.last_seen))  n.meta.push({ label: '最后', value: date(item.last_seen) });
        if (item.objective) n.meta.push({ label: '目标', value: item.objective.slice(0, 60) });
        break;
      }
      case 'report': {
        if (item.report_types?.length) n.tags.unshift(...item.report_types);
        if (date(item.published)) n.meta.push({ label: '发布', value: date(item.published) });
        if (item.object_refs?.length) n.meta.push({ label: '关联对象', value: String(item.object_refs.length) });
        break;
      }
      case 'attack-pattern': {
        const mitre = item.external_references?.find(r => r.source_name === 'mitre-attack');
        if (mitre?.external_id) n.subtitle = mitre.external_id;
        const phases = item.kill_chain_phases?.map(p => p.phase_name) ?? [];
        if (phases.length) n.tags.unshift(...phases);
        break;
      }
      case 'intrusion-set': {
        const a = aliases(item.aliases);
        if (a) n.meta.push({ label: '别名', value: a });
        if (date(item.first_seen))   n.meta.push({ label: '首次', value: date(item.first_seen) });
        if (date(item.last_seen))    n.meta.push({ label: '最后', value: date(item.last_seen) });
        if (item.resource_level)     n.meta.push({ label: '资源', value: item.resource_level });
        if (item.sophistication)     n.meta.push({ label: '复杂度', value: item.sophistication });
        break;
      }
      case 'infrastructure': {
        if (item.infrastructure_types?.length) n.tags.unshift(...item.infrastructure_types);
        if (date(item.first_seen)) n.meta.push({ label: '首次', value: date(item.first_seen) });
        if (date(item.last_seen))  n.meta.push({ label: '最后', value: date(item.last_seen) });
        break;
      }
      case 'identity': {
        if (item.identity_class)   n.meta.push({ label: '类别', value: item.identity_class });
        const sectors = item.sectors?.slice(0, 2).join(', ');
        if (sectors) n.meta.push({ label: '行业', value: sectors });
        if (item.contact_information) n.meta.push({ label: '联系', value: item.contact_information.slice(0, 60) });
        break;
      }
    }

    n.tags = n.tags.slice(0, 4);
    n.meta = n.meta.slice(0, 4);
    return n;
  }

  function renderEntityResults(items) {
    const container = document.getElementById('entity-results');
    if (!items.length) {
      container.innerHTML = '<div class="text-sm text-slate-500 py-12 text-center col-span-3">未找到相关实体</div>';
      return;
    }
    container.innerHTML = '';
    items.forEach(item => {
      const typeMeta = TYPE_META[item.type] || { label: item.type ?? '实体' };
      const n = normalizeEntity(item);

      const tagsHtml = n.tags.map(t =>
        `<span class="text-[10px] px-2 py-0.5 rounded bg-white/5 text-slate-400 border border-white/10 font-label-caps">${esc(t)}</span>`
      ).join('');

      const metaHtml = n.meta.map(m =>
        `<span class="text-[10px] text-slate-500">${esc(m.label)}: <span class="text-slate-300">${esc(String(m.value))}</span></span>`
      ).join('<span class="text-slate-700 mx-1.5">·</span>');

      const card = document.createElement('div');
      card.className = 'glass-panel p-4 rounded-lg tactical-corner hover:bg-white/5 transition-all flex flex-col gap-2.5';
      card.innerHTML = `
        <div>
          <div class="flex items-center gap-2 mb-1">
            <span class="text-[10px] font-label-caps text-cyan-500/80 tracking-widest uppercase">${esc(typeMeta.label)}</span>
            ${n.subtitle ? `<span class="text-[10px] text-slate-500 font-mono truncate">${esc(n.subtitle)}</span>` : ''}
          </div>
          <h3 class="text-sm font-bold text-on-surface leading-snug line-clamp-2">${esc(n.headline)}</h3>
        </div>
        ${n.description ? `<p class="text-xs text-slate-400 line-clamp-2">${esc(n.description)}</p>` : ''}
        ${tagsHtml ? `<div class="flex flex-wrap gap-1">${tagsHtml}</div>` : ''}
        ${metaHtml ? `<div class="flex flex-wrap items-center gap-y-1">${metaHtml}</div>` : ''}
        <button class="mt-auto w-full py-2 border border-cyan-500/30 text-cyan-400 rounded hover:bg-cyan-400 hover:text-slate-950 transition-all font-label-caps text-xs">查看全维图谱</button>
      `;
      card.querySelector('button').addEventListener('click', () => {
        window.location.href = `/workbench?type=${encodeURIComponent(item.type ?? '')}&id=${encodeURIComponent(item.id ?? '')}`;
      });
      container.appendChild(card);
    });
  }

  // === Helpers ===
  function esc(s) {
    const d = document.createElement('span');
    d.textContent = s;
    return d.innerHTML;
  }

  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const mins = Math.floor(diff / 60000);
    if (mins < 1) return '刚刚';
    if (mins < 60) return `${mins}分钟前`;
    const hrs = Math.floor(mins / 60);
    if (hrs < 24) return `${hrs}小时前`;
    const days = Math.floor(hrs / 24);
    if (days < 30) return `${days}天前`;
    return `${Math.floor(days / 30)}个月前`;
  }

  // === Bindings ===
  searchBtn?.addEventListener('click', () => doSearch());
  searchInput?.addEventListener('keydown', e => { if (e.key === 'Enter') doSearch(); });
</script>
</body></html>
