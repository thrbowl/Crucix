<!DOCTYPE html>
<html class="dark" lang="zh">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="/libs/tailwind.js"></script>
<link href="/libs/fonts/space-grotesk-inter.css" rel="stylesheet"/>
<link href="/libs/fonts/material-symbols.css" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "on-secondary-fixed": "#40000d",
                        "on-secondary-container": "#ffc2c4",
                        "surface-tint": "#00daf3",
                        "neon-glow": "rgba(0, 229, 255, 0.3)",
                        "on-surface": "#dce4e5",
                        "on-secondary": "#67001b",
                        "tertiary-fixed-dim": "#f3bf26",
                        "tertiary": "#ffeac0",
                        "secondary": "#ffb2b7",
                        "on-surface-variant": "#bac9cc",
                        "secondary-fixed-dim": "#ffb2b7",
                        "primary-container": "#00e5ff",
                        "outline": "#849396",
                        "on-tertiary-fixed": "#251a00",
                        "on-tertiary": "#3e2e00",
                        "primary": "#c3f5ff",
                        "surface-container-highest": "#2e3638",
                        "surface-container": "#192122",
                        "text-secondary": "#94A3B8",
                        "tertiary-fixed": "#ffdf96",
                        "surface-variant": "#2e3638",
                        "inverse-on-surface": "#2a3233",
                        "background": "#0B0E14",
                        "surface-container-lowest": "#080f11",
                        "surface-bright": "#333a3c",
                        "on-primary": "#00363d",
                        "on-background": "#dce4e5",
                        "primary-fixed-dim": "#00daf3",
                        "on-primary-container": "#00626e",
                        "tertiary-container": "#fec931",
                        "border-subtle": "rgba(255, 255, 255, 0.08)",
                        "on-primary-fixed-variant": "#004f58",
                        "on-secondary-fixed-variant": "#92002a",
                        "on-error-container": "#ffdad6",
                        "primary-fixed": "#9cf0ff",
                        "surface-container-low": "#151d1e",
                        "text-primary": "#E2E8F0",
                        "error-container": "#93000a",
                        "error": "#ffb4ab",
                        "secondary-container": "#b50036",
                        "on-tertiary-fixed-variant": "#594400",
                        "secondary-fixed": "#ffdadb",
                        "on-primary-fixed": "#001f24",
                        "surface": "rgba(20, 25, 35, 0.6)",
                        "on-tertiary-container": "#6f5500",
                        "surface-container-high": "#242b2d",
                        "outline-variant": "#3b494c",
                        "inverse-surface": "#dce4e5",
                        "surface-dim": "#0d1516",
                        "on-error": "#690005",
                        "inverse-primary": "#006875"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "xl": "40px",
                        "margin": "24px",
                        "gutter": "16px",
                        "lg": "24px",
                        "unit": "4px",
                        "md": "16px",
                        "xs": "4px",
                        "sm": "8px"
                    },
                    "fontFamily": {
                        "mono-data": ["Space Grotesk"],
                        "label-caps": ["Space Grotesk"],
                        "h2": ["Space Grotesk"],
                        "h3": ["Space Grotesk"],
                        "h1": ["Space Grotesk"],
                        "body-md": ["Inter"],
                        "body-lg": ["Inter"]
                    },
                    "fontSize": {
                        "mono-data": ["14px", {"lineHeight": "1.4", "fontWeight": "500"}],
                        "label-caps": ["12px", {"lineHeight": "1.0", "letterSpacing": "0.1em", "fontWeight": "700"}],
                        "h2": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.01em", "fontWeight": "600"}],
                        "h3": ["24px", {"lineHeight": "1.3", "fontWeight": "600"}],
                        "h1": ["48px", {"lineHeight": "1.1", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "1.6", "fontWeight": "400"}]
                    }
                },
            },
        }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-panel {
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            background: rgba(20, 25, 35, 0.6);
        }
        .neon-border-glow:hover {
            box-shadow: 0 0 15px rgba(0, 229, 255, 0.2);
            border-color: rgba(0, 229, 255, 0.4);
        }
        .status-dot-ok {
            background-color: #00e5ff;
            box-shadow: 0 0 8px #00e5ff;
            animation: pulse 2s infinite ease-in-out;
        }
        .status-dot-fail {
            background-color: #ffb4ab;
            box-shadow: 0 0 8px #ffb4ab;
            animation: pulse 1.5s infinite ease-in-out;
        }
        .status-dot-skip {
            background-color: #849396;
            box-shadow: 0 0 4px #849396;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        ::-webkit-scrollbar { width: 4px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 229, 255, 0.2); border-radius: 10px; }
    </style>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden">


<div id="page-content" style="visibility:hidden" class="flex h-screen pt-16">


  <!-- Main Content -->
  <main class="flex-1 overflow-y-auto bg-background p-6 lg:p-10 relative ml-64">
    <!-- Atmospheric BG Elements -->
    <div class="absolute top-0 right-0 w-[500px] h-[500px] bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
    <div class="relative z-10 max-w-7xl mx-auto space-y-8">

      <!-- Header Section -->
      <header class="flex flex-col md:flex-row justify-between items-start md:items-end gap-4">
        <div>
          <h1 class="font-h1 text-h2 text-on-surface uppercase tracking-tight">数据源状态</h1>
          <p id="health-status" class="text-text-secondary font-body-md mt-2">实时监控 49 个核心数据源的连通性与响应效能</p>
        </div>
        <div class="flex gap-3">
          <div class="flex items-center px-4 py-2 glass-panel rounded border-white/10 gap-4">
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full status-dot-ok"></span>
              <span class="text-[10px] font-label-caps text-on-surface/60 uppercase">正常</span>
            </div>
            <div class="flex items-center gap-2">
              <span class="w-2 h-2 rounded-full status-dot-fail"></span>
              <span class="text-[10px] font-label-caps text-on-surface/60 uppercase">故障</span>
            </div>
          </div>
        </div>
      </header>

      <!-- Bento Grid Layout -->
      <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">

        <!-- Left: Health Matrix (49 items) -->
        <div class="lg:col-span-8 glass-panel rounded-xl p-6 border-white/10">
          <div class="flex justify-between items-center mb-6">
            <h3 class="font-h3 text-h3 flex items-center gap-2">
              <span class="material-symbols-outlined text-primary">grid_view</span>
              数据源矩阵
            </h3>
          </div>
          <div id="source-matrix" class="space-y-6"></div>
        </div>

        <!-- Right Column: Chart & Logs -->
        <div class="lg:col-span-4 space-y-6">

          <!-- Overall Success Rate -->
          <div class="glass-panel rounded-xl p-6 border-white/10 flex flex-col items-center text-center">
            <h3 class="font-label-caps text-on-surface/60 uppercase mb-6 tracking-widest w-full text-left">总运行成功率</h3>
            <div class="relative w-48 h-48 flex items-center justify-center">
              <!-- SVG Circular Chart -->
              <svg class="w-full h-full transform -rotate-90">
                <circle class="text-white/5" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-width="8"></circle>
                <circle class="text-cyan-400 drop-shadow-[0_0_12px_rgba(0,229,255,0.6)]" cx="96" cy="96" fill="transparent" r="80" stroke="currentColor" stroke-dasharray="502.4" stroke-dashoffset="30.1" stroke-width="12"></circle>
              </svg>
              <div class="absolute flex flex-col items-center">
                <span id="success-rate" class="font-h1 text-h1 text-cyan-400 leading-none">--</span>
                <span class="text-xs font-mono-data text-cyan-400/60 uppercase mt-1">百分比</span>
              </div>
            </div>
            <div class="grid grid-cols-3 gap-4 mt-8 w-full border-t border-white/5 pt-6">
              <div>
                <div class="text-[10px] font-label-caps text-on-surface/40 uppercase">活跃</div>
                <div id="count-active" class="text-lg font-mono-data text-on-surface">--</div>
              </div>
              <div>
                <div class="text-[10px] font-label-caps text-on-surface/40 uppercase">故障</div>
                <div id="count-fail" class="text-lg font-mono-data text-error">--</div>
              </div>
              <div>
                <div class="text-[10px] font-label-caps text-on-surface/40 uppercase">跳过</div>
                <div id="count-skip" class="text-lg font-mono-data text-slate-400">--</div>
              </div>
            </div>
          </div>

          <!-- Failure Logs -->
          <div class="glass-panel rounded-xl p-6 border-white/10 flex-1">
            <div class="flex justify-between items-center mb-4">
              <h3 class="font-label-caps text-on-surface/60 uppercase tracking-widest">最近故障日志</h3>
              <span class="material-symbols-outlined text-xs text-primary cursor-pointer hover:rotate-180 transition-transform">refresh</span>
            </div>
            <div id="failure-log-list" class="space-y-4 max-h-[300px] overflow-y-auto pr-2"></div>
          </div>

        </div>
      </div>

      <!-- Decorative UI Elements -->
      <div class="fixed bottom-10 right-10 flex gap-4 opacity-40">
        <div class="flex flex-col items-end">
          <div class="text-[10px] font-mono-data tracking-tighter text-cyan-400">系统在线时长</div>
          <div class="text-sm font-mono-data">428:12:09:55</div>
        </div>
        <div class="w-px h-10 bg-gradient-to-t from-transparent via-cyan-400 to-transparent"></div>
      </div>

    </div>
  </main>
</div>

<script type="module">
  import { initShell } from './shell.js';
  import { apiFetch } from './auth.js';
  await initShell('sources');

  const matrixEl = document.getElementById('source-matrix');
  const logList = document.getElementById('failure-log-list');
  const CIRC = 2 * Math.PI * 80; // 502.4

  const DOMAIN_LABELS = {
    vulnerability_intel: { label: '漏洞情报', icon: 'bug_report' },
    threat_actors:      { label: '威胁行为者与恶意软件', icon: 'coronavirus' },
    attack_exposure:    { label: '攻击活动与暴露面', icon: 'radar' },
    event_tracking:     { label: '事件追踪与安全社区', icon: 'newspaper' },
    china_intel:        { label: '中国情报源', icon: 'language' },
    vendor_feeds:       { label: '厂商公告', icon: 'campaign' },
  };

  function renderMatrix(sources) {
    matrixEl.innerHTML = '';
    const active = sources.filter(s => s.last_status === 'active').length;
    const errors = sources.filter(s => s.last_status === 'error').length;
    const inactive = sources.filter(s => s.last_status === 'inactive').length;
    const noData = sources.filter(s => !s.last_status).length;
    const skip = inactive + noData;
    const rate = sources.length ? (active / sources.length * 100) : 0;

    // Group by domain
    const groups = {};
    for (const src of sources) {
      const d = src.domain || 'other';
      if (!groups[d]) groups[d] = [];
      groups[d].push(src);
    }

    // Render groups in defined order
    for (const [domain, meta] of Object.entries(DOMAIN_LABELS)) {
      const items = groups[domain];
      if (!items?.length) continue;
      delete groups[domain];

      const grpActive = items.filter(s => s.last_status === 'active').length;
      const groupEl = document.createElement('div');
      groupEl.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-primary text-base">${meta.icon}</span>
          <span class="text-sm font-label-caps text-on-surface/70 uppercase tracking-widest">${meta.label}</span>
          <span class="text-[10px] font-mono-data text-primary/50">${grpActive}/${items.length}</span>
        </div>
        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2"></div>`;
      const grid = groupEl.querySelector('div:last-child');

      for (const src of items) {
        grid.appendChild(createSourceCard(src));
      }
      matrixEl.appendChild(groupEl);
    }

    // Any remaining domains not in DOMAIN_LABELS
    for (const [domain, items] of Object.entries(groups)) {
      const groupEl = document.createElement('div');
      groupEl.innerHTML = `
        <div class="flex items-center gap-2 mb-3">
          <span class="material-symbols-outlined text-primary text-base">source</span>
          <span class="text-sm font-label-caps text-on-surface/70 uppercase tracking-widest">${domain.replace(/_/g, ' ')}</span>
        </div>
        <div class="grid grid-cols-4 sm:grid-cols-8 gap-2"></div>`;
      const grid = groupEl.querySelector('div:last-child');
      for (const src of items) grid.appendChild(createSourceCard(src));
      matrixEl.appendChild(groupEl);
    }

    // Update SVG chart
    const rateEl = document.getElementById('success-rate');
    const circle = document.querySelector('svg circle:nth-child(2)');
    if (rateEl) rateEl.textContent = rate.toFixed(1);
    if (circle) circle.setAttribute('stroke-dashoffset', CIRC * (1 - rate / 100));

    const activeEl = document.getElementById('count-active');
    const failEl = document.getElementById('count-fail');
    const skipEl = document.getElementById('count-skip');
    if (activeEl) activeEl.textContent = String(active).padStart(2, '0');
    if (failEl) failEl.textContent = String(errors).padStart(2, '0');
    if (skipEl) skipEl.textContent = String(skip).padStart(2, '0');
  }

  function createSourceCard(src) {
    const st = src.last_status;
    const isFail = st === 'error';
    const isSkip = !st || st === 'inactive';

    const card = document.createElement('div');
    card.className = `aspect-square glass-panel rounded-lg flex flex-col justify-between p-2.5 transition-all cursor-crosshair group ${isFail ? 'border-error/20 hover:border-error/50 bg-error/5' : isSkip ? 'border-white/5 hover:border-white/20 opacity-50' : 'border-white/5 hover:border-primary/40'}`;
    card.title = src.homepage_url || '';

    const dot = isFail ? 'status-dot-fail' : isSkip ? 'status-dot-skip' : 'status-dot-ok';
    const nameColor = isFail ? 'text-error/90' : 'text-on-surface/90';
    const subColor = isFail ? 'text-error/60' : isSkip ? 'text-on-surface/40' : 'text-primary/60';
    const subText = isFail ? (src.last_error || 'ERROR').substring(0, 12) : isSkip ? (src.enabled ? 'INACTIVE' : 'DISABLED') : (src.avg_duration_ms ? src.avg_duration_ms + 'ms' : '--');

    card.innerHTML = `
      <div class="flex justify-end">
        <span class="w-1.5 h-1.5 rounded-full ${dot}"></span>
      </div>
      <div>
        <div class="text-[11px] font-bold font-mono-data ${nameColor} truncate">${src.name}</div>
        <div class="text-[9px] font-mono-data ${subColor}">${subText}</div>
      </div>`;
    return card;
  }

  function renderFailureLogs(sources) {
    if (!logList) return;
    logList.innerHTML = '';
    const failed = sources
      .filter(s => s.last_status === 'error' && s.last_failure_at)
      .sort((a, b) => new Date(b.last_failure_at) - new Date(a.last_failure_at));

    for (const src of failed) {
      const time = new Date(src.last_failure_at).toLocaleTimeString('zh-CN', { hour12: false });
      const item = document.createElement('div');
      item.className = 'p-3 bg-error/5 border-l-2 border-error/50 rounded flex gap-4';
      item.innerHTML = `
        <div class="text-error mt-1"><span class="material-symbols-outlined text-sm">warning</span></div>
        <div class="flex-1">
          <div class="flex justify-between text-[10px] font-mono-data text-error/80 uppercase">
            <span>${src.name}</span>
            <span>${time}</span>
          </div>
          <div class="text-[12px] text-on-surface-variant font-medium mt-1">${src.last_error || '连接异常'}</div>
        </div>`;
      logList.appendChild(item);
    }
    if (failed.length === 0) {
      logList.innerHTML = '<div class="text-center text-on-surface/40 text-sm py-8">暂无故障记录</div>';
    }
  }

  async function loadSources() {
    try {
      const res = await apiFetch('/api/sources');
      if (!res?.ok) return;
      const sources = await res.json();
      renderMatrix(sources);
      renderFailureLogs(sources);
      const statusEl = document.getElementById('health-status');
      if (statusEl) {
        const active = sources.filter(s => s.last_status === 'active').length;
        statusEl.textContent = `实时监控 ${sources.length} 个核心数据源 — ${active}/${sources.length} 活跃`;
      }
    } catch { /* retain static content */ }
  }

  loadSources();

  // SSE: reload on data refresh
  const token = localStorage.getItem('crx_access_token');
  const evtSrc = new EventSource(`/events?token=${encodeURIComponent(token ?? '')}`);
  evtSrc.addEventListener('refresh', () => loadSources());

  // SSE: real-time source failure alerts
  evtSrc.addEventListener('source_status', (e) => {
    try {
      const evt = JSON.parse(e.data);
      if (!logList || evt.status === 'ok') return;
      const time = new Date().toLocaleTimeString('zh-CN', { hour12: false });
      const item = document.createElement('div');
      item.className = 'p-3 bg-error/5 border-l-2 border-error/50 rounded flex gap-4';
      item.innerHTML = `
        <div class="text-error mt-1"><span class="material-symbols-outlined text-sm">warning</span></div>
        <div class="flex-1">
          <div class="flex justify-between text-[10px] font-mono-data text-error/80 uppercase">
            <span>${evt.source ?? 'UNKNOWN'}</span>
            <span>${time}</span>
          </div>
          <div class="text-[12px] text-on-surface-variant font-medium mt-1">${evt.message ?? '连接异常'}</div>
        </div>`;
      logList.prepend(item);
      while (logList.children.length > 10) logList.lastElementChild.remove();
    } catch {}
  });

  evtSrc.onerror = () => evtSrc.close();
</script>
</body>
</html>
